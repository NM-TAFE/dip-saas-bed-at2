# Docker-only overrides; these win over .env inside the containers,
# so .env keeps working for `php artisan` on the host.
x-app-env: &app-env
  REDIS_HOST: redis
  QUEUE_CONNECTION: redis
  TELESCOPE_ENABLED: "true"
  TELESCOPE_DB_HOST: mysql

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    # --no-reload keeps the x-app-env overrides; without it serve strips them
    # from the request worker. Restart the service after editing .env.
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    restart: unless-stopped

  horizon:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    command: php artisan horizon
    # horizon:terminate exits cleanly; this brings it back with fresh code.
    restart: unless-stopped

  # Runs routes/console.php schedule (Horizon metrics, Telescope pruning).
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    command: php artisan schedule:work
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: telescope
      MYSQL_USER: telescope
      MYSQL_PASSWORD: ${TELESCOPE_DB_PASSWORD:?Set TELESCOPE_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      retries: 20

volumes:
  redis_data:
  mysql_data:
